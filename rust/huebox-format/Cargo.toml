[package]
name = "huebox-format"
version = "0.5.0"
edition = "2021"
description = "Terminal colour-format rules (ghostty, kitty, alacritty) for huebox"
license = "MIT"
repository = "https://github.com/MikkelKappelPersson/huebox"
readme = "../../README.md"
keywords = ["terminal", "theme", "tui", "ghostty", "kitty"]

[lib]
name = "huebox_format"
path = "src/lib.rs"

[dependencies]
huebox-core = { version = "0.5.0", path = "../huebox-core" }
