[package]
name = "huebox-lib"
version = "0.5.0"
edition = "2021"
description = "Theme library, terminal detection and push logic for the huebox terminal theme editor"
license = "MIT"
repository = "https://github.com/MikkelKappelPersson/huebox"
readme = "../../README.md"
keywords = ["terminal", "theme", "tui", "ghostty", "kitty"]

[lib]
name = "huebox_lib"
path = "src/lib.rs"

[dependencies]
huebox-core = { version = "0.5.0", path = "../huebox-core" }
huebox-format = { version = "0.5.0", path = "../huebox-format" }
chrono = "0.4"
