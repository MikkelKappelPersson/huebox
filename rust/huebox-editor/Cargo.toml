[package]
name = "huebox-editor"
version = "0.5.0"
edition = "2021"
description = "Editing session state machine for the huebox terminal theme editor"
license = "MIT"
repository = "https://github.com/MikkelKappelPersson/huebox"
readme = "../../README.md"
keywords = ["terminal", "theme", "tui", "ghostty", "kitty"]

[lib]
name = "huebox_editor"
path = "src/lib.rs"

[dependencies]
huebox-core = { version = "0.5.0", path = "../huebox-core" }
huebox-render = { version = "0.5.0", path = "../huebox-render" }
