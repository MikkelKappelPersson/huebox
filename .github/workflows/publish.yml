name: Publish

# Release first, then PyPI, then AUR: a version tag builds, tests,
# drafts the GitHub Release with the sdist/wheel attached, uploads to
# PyPI, and finally bumps the AUR package (whose source *is* the PyPI
# sdist, so it must go last). Tag shape: vX.Y.Z (e.g. v0.3.0) and it must
# match [project] version.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI instead of PyPI (dry run)"
        type: boolean
        default: true

permissions:
  contents: write # needed to create the GitHub Release
  id-token: write # needed for PyPI Trusted Publishing (OIDC, no token)

jobs:
  build:
    name: Test + build dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag: $TAG  pyproject: $VER"
          test "$TAG" = "$VER" || { echo "::error::tag v$TAG does not match pyproject version $VER"; exit 1; }

      - name: Install package + build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./[test]" build twine

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build sdist + wheel
        run: python -m build

      - name: Check dist
        run: |
          twine check dist/*
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # tag v* pushes already name the release after the tag; keep it a
          # real release, not a draft, so the PyPI job after this has a
          # visible artefact even if the PyPI upload ever fails.
          draft: false
          prerelease: false

  pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    runs-on: ubuntu-latest
    # Manual runs default to TestPyPI so the dry run never pollutes the real
    # index; tag pushes always go to the real PyPI.
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.testpypi) && 'testpypi' || 'pypi' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.testpypi) && 'https://test.pypi.org/p/huebox' || 'https://pypi.org/p/huebox' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || !inputs.testpypi
        uses: pypa/gh-action-pypi-publish@release/v1

  aur:
    name: Publish to AUR
    # tags only: a manual run must never touch the real AUR, and the
    # PKGBUILD's source *is* the PyPI sdist, so this goes after PyPI.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, github-release, pypi]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    environment:
      name: aur
      url: https://aur.archlinux.org/packages/huebox
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh base-devel

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Clone the AUR repo as a non-root builder
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not set - add the AUR account's key under the 'aur' environment"
            exit 1
          fi
          useradd -m builder
          install -dm700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /home/builder/.ssh/id_ed25519
          chmod 600 /home/builder/.ssh/id_ed25519
          chown builder:builder /home/builder/.ssh/id_ed25519
          printf 'Host aur.archlinux.org\n  IdentityFile /home/builder/.ssh/id_ed25519\n  IdentitiesOnly yes\n' > /home/builder/.ssh/config
          chown builder:builder /home/builder/.ssh/config
          ssh-keyscan -t ed25519 aur.archlinux.org > /home/builder/.ssh/known_hosts
          chown builder:builder /home/builder/.ssh/known_hosts
          git config --global --add safe.directory /home/builder/huebox
          su builder -c "git clone ssh://aur@aur.archlinux.org/huebox.git /home/builder/huebox"

      - name: Bump pkgver + sums, regenerate .SRCINFO
        run: |
          set -e
          VER="${GITHUB_REF#refs/tags/v}"
          SUM="$(sha256sum "dist/huebox-$VER.tar.gz" | cut -d' ' -f1)"
          echo "aur release $VER sha256 $SUM"
          su builder -c "export VER='$VER' SUM='$SUM'; cd /home/builder/huebox && sed -i -e \"s/^pkgver=.*/pkgver=\$VER/\" -e \"s/^sha256sums=.*/sha256sums=('\$SUM')/\" PKGBUILD && grep -E '^(pkgver|sha256sums)=' PKGBUILD"
          su builder -c "cd /home/builder/huebox && makepkg --printsrcinfo > .SRCINFO"
          # the sdist must actually be fetchable before the AUR points at
          # it; the PyPI CDN can lag the upload by several minutes. The flag
          # matters: a bare retry loop exits 0 even when every attempt
          # fails, which would push a PKGBUILD whose source 404s.
          su builder -c 'cd /home/builder/huebox && ok=0; for i in $(seq 1 10); do makepkg --verifysource && { ok=1; break; }; sleep 60; done; test $ok = 1'

      - name: Commit + push to AUR
        run: |
          cd /home/builder/huebox
          if git diff --quiet; then echo "AUR already at this version - nothing to do"; exit 0; fi
          su builder -c "cd /home/builder/huebox && git -c user.name='huebox-release' -c user.email='huebox-release@users.noreply.github.com' commit -am \"huebox \$(grep '^pkgver=' PKGBUILD | cut -d= -f2)\" && git push origin master"

  homebrew:
    name: Publish to Homebrew tap
    # tags only: a manual run must never touch the real tap, and the
    # formula's source *is* the PyPI sdist, so this goes after PyPI.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, github-release, pypi]
    runs-on: ubuntu-latest
    environment:
      name: homebrew
      url: https://github.com/MikkelKappelPersson/homebrew-huebox
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Bump url + sha256, push to the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -e
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN secret is not set - add the fine-grained PAT under the 'homebrew' environment"
            exit 1
          fi
          VER="${GITHUB_REF#refs/tags/v}"
          SUM="$(sha256sum "dist/huebox-$VER.tar.gz" | cut -d' ' -f1)"
          echo "tap release $VER sha256 $SUM"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/MikkelKappelPersson/homebrew-huebox.git" tap
          cd tap
          # first sha256 only: the resource stanzas below stay pinned
          # until huebox's own dependencies change.
          sed -i -e "s|^  url \"https://files.pythonhosted.org.*|  url \"https://files.pythonhosted.org/packages/source/h/huebox/huebox-$VER.tar.gz\"|" \
                 -e "0,/^  sha256 \".*\"/s//  sha256 \"$SUM\"/" Formula/huebox.rb
          grep -E '^  (url|sha256) "' Formula/huebox.rb | head -n 2
          if git diff --quiet; then echo "tap already at this version - nothing to do"; exit 0; fi
          git -c user.name='huebox-release' -c user.email='huebox-release@users.noreply.github.com' commit -am "huebox $VER"
          git push origin main
