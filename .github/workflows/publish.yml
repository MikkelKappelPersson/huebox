name: Publish

# One tag ships every target: Rust gates, then crates.io plus the GitHub
# Release binary in parallel, then PyPI wheels, then the AUR and Homebrew
# pointers. Tag shape: vX.Y.Z (e.g. v0.5.0) and it must match all 7
# rust/*/Cargo.toml versions.
#
# Source of truth per target:
#   crates.io  — the single `huebox` crate (Trusted Publishing)
#   GitHub     — prebuilt binaries per tag (linux x86_64 + aarch64,
#                mac arm64 + Intel), each tarball + sha256
#   PyPI       — binary wheel (prebuilt binary + launcher, ruff-style)
#   AUR        — `huebox` ships the prebuilt x86_64-linux Release tarball
#                (binary in the package, not a source build)
#   Homebrew   — formula builds from the Git tag archive with cargo
# The pty replay harness stays a local gate (needs pyte + minutes); CI
# runs the cargo suite, clippy, fmt and the release build.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI instead of PyPI (dry run)"
        type: boolean
        default: true

permissions:
  contents: write # needed to create the GitHub Release
  id-token: write # needed for Trusted Publishing (crates.io + PyPI, OIDC)

jobs:
  gates:
    name: Rust gates + release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          grep -q "^version = \"$TAG\"$" rust/Cargo.toml || { echo "::error::rust/Cargo.toml version does not match tag v$TAG"; exit 1; }
          echo "tag v$TAG matches rust/Cargo.toml"

      - name: Run tests
        run: cargo test --workspace --manifest-path rust/Cargo.toml

      - name: Clippy
        run: cargo clippy --workspace --manifest-path rust/Cargo.toml -- -D warnings

      - name: Format
        run: cd rust && cargo fmt --check

      - name: Release build
        run: cargo build --release --manifest-path rust/Cargo.toml

  crates:
    name: Publish to crates.io
    # tags only: a manual run must never touch the real index. One crate,
    # so no ordering or index-lag loop — but re-runs stay safe: an
    # already-uploaded version counts as success.
    if: startsWith(github.ref, 'refs/tags/')
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          if out=$(cd rust && cargo publish 2>&1); then echo "$out"; exit 0; fi
          echo "$out"
          case "$out" in
            *"already uploaded"*|*"already exists"*) echo "huebox already on crates.io - nothing to do";;
            *"no token found"*)
              # OIDC trusted publishing should have covered this; if cargo
              # never attempted the exchange, fall back to the token secret.
              if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
                echo "::error::cargo found no token and CARGO_REGISTRY_TOKEN is unset - add a scoped crates.io token as the CARGO_REGISTRY_TOKEN repo secret"; exit 1
              fi
              echo "retrying with CARGO_REGISTRY_TOKEN"
              out2=$(cd rust && cargo publish 2>&1) && { echo "$out2"; exit 0; }
              echo "$out2"
              case "$out2" in
                *"already uploaded"*|*"already exists"*) echo "huebox already on crates.io - nothing to do";;
                *) echo "::error::publishing huebox failed"; exit 1;;
              esac;;
            *) echo "::error::publishing huebox failed"; exit 1;;
          esac

  binaries:
    name: Prebuilt binary (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64-linux
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native: true
          - label: aarch64-linux
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            native: true
          - label: arm64-macos
            runs-on: macos-14
            target: aarch64-apple-darwin
            native: true
          - label: x86_64-macos
            runs-on: macos-14
            target: x86_64-apple-darwin
            native: false
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Release build
        run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }}

      - name: Tarball + sha256
        run: |
          set -e
          VER="${GITHUB_REF#refs/tags/v}"
          T="huebox-$VER-${{ matrix.label }}"
          BIN="rust/target/${{ matrix.target }}/release/huebox"
          chmod +x "$BIN"
          # Flat tarball: the binary rides at the root, so every consumer
          # (AUR, Homebrew, humans) installs it the same way.
          tar -czf "$T.tar.gz" -C "$(dirname "$BIN")" huebox
          if [ "${{ matrix.native }}" = "true" ]; then tar -xzf "$T.tar.gz" -O huebox > ./smoke && chmod +x ./smoke && ./smoke --version && rm ./smoke; fi
          (sha256sum "$T.tar.gz" || shasum -a 256 "$T.tar.gz") | tee "$T.tar.gz.sha256"
          mkdir release && mv "$T.tar.gz" "$T.tar.gz.sha256" release/

      - uses: actions/upload-artifact@v4
        with:
          name: release-bin-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bin-*
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false

  wheels:
    name: Build wheels
    needs: gates
    # Pinned to 22.04 (glibc 2.35): the wheel binary is built here, not in
    # gates, so the manylinux tag below stays honest and widely installable.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Release build for the wheel
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Pack wheel
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF#refs/tags/v}"; else VER="0.0.0.dev$(date +%s)"; fi
          python .github/pack-wheel.py --binary rust/target/release/huebox --version "$VER" --plat manylinux_2_35_x86_64 --out wheels
          ls -l wheels

      - name: Smoke test the wheel
        run: |
          set -e
          python -m venv wheeltest
          ./wheeltest/bin/pip install -q wheels/*.whl
          ./wheeltest/bin/huebox --version

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheels/*
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    # Manual runs default to TestPyPI so the dry run never pollutes the real
    # index; tag pushes always go to the real PyPI.
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.testpypi) && 'testpypi' || 'pypi' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.testpypi) && 'https://test.pypi.org/p/huebox' || 'https://pypi.org/p/huebox' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: wheels/

      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || !inputs.testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/

  aur:
    name: Publish to AUR
    # tags only: a manual run must never touch the real AUR. Runs after
    # PyPI and the Release so the index and the artefact are visible
    # before the pointer moves.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [github-release, pypi]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    environment:
      name: aur
      url: https://aur.archlinux.org/packages/huebox
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh base-devel curl

      - name: Fetch release tarball + sha256
        run: |
          set -e
          VER="${GITHUB_REF#refs/tags/v}"
          curl -sL -o huebox.tar.gz "https://github.com/MikkelKappelPersson/huebox/releases/download/v$VER/huebox-$VER-x86_64-linux.tar.gz"
          SUM="$(sha256sum huebox.tar.gz | cut -d' ' -f1)"
          echo "aur release $VER sha256 $SUM"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "SUM=$SUM" >> "$GITHUB_ENV"

      - name: Clone the AUR repo as a non-root builder
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not set - add the AUR account's key under the 'aur' environment"
            exit 1
          fi
          useradd -m builder
          install -dm700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /home/builder/.ssh/id_ed25519
          chmod 600 /home/builder/.ssh/id_ed25519
          chown builder:builder /home/builder/.ssh/id_ed25519
          printf 'Host aur.archlinux.org\n  IdentityFile /home/builder/.ssh/id_ed25519\n  IdentitiesOnly yes\n' > /home/builder/.ssh/config
          chown builder:builder /home/builder/.ssh/config
          ssh-keyscan -t ed25519 aur.archlinux.org > /home/builder/.ssh/known_hosts
          chown builder:builder /home/builder/.ssh/known_hosts
          git config --global --add safe.directory /home/builder/huebox
          su builder -c "git clone ssh://aur@aur.archlinux.org/huebox.git /home/builder/huebox"

      - name: Bootstrap binary PKGBUILD on first run
        run: |
          set -e
          if su builder -c "cd /home/builder/huebox && grep -q 'releases/download' PKGBUILD"; then
            echo "PKGBUILD already binary-shaped - version bump only"
          else
            echo "one-time bootstrap: writing binary PKGBUILD (no local AUR key needed)"
            {
              printf '%s\n' \
                '# Maintainer: Mikkel Kappel Persson <mikkel@kappelpersson.dk>' \
                'pkgname=huebox' \
                'pkgver=PKGVER' \
                'pkgrel=1' \
                "pkgdesc='Terminal theme editor with live preview'" \
                "arch=('x86_64')" \
                "url='https://github.com/MikkelKappelPersson/huebox'" \
                "license=('MIT')" \
                "depends=('gcc-libs')" \
                'source=("huebox-$pkgver-x86_64-linux.tar.gz::$url/releases/download/v$pkgver/huebox-$pkgver-x86_64-linux.tar.gz")' \
                "sha256sums=('PKGSUM')" \
                '' \
                'package() {' \
                '  install -Dm755 huebox "$pkgdir/usr/bin/huebox"' \
                '}'
            } > /home/builder/huebox/PKGBUILD
            chown builder:builder /home/builder/huebox/PKGBUILD
          fi

      - name: Bump pkgver + sums, regenerate .SRCINFO
        run: |
          set -e
          su builder -c "export VER='$VER' SUM='$SUM'; cd /home/builder/huebox && sed -i -e \"s/^pkgver=.*/pkgver=\$VER/\" -e \"s/^sha256sums=.*/sha256sums=('\$SUM')/\" PKGBUILD && grep -E '^(pkgver|sha256sums)=' PKGBUILD"
          su builder -c "cd /home/builder/huebox && makepkg --printsrcinfo > .SRCINFO"
          # the release asset must actually be fetchable before the AUR
          # points at it. The flag matters: a bare retry loop exits 0
          # even when every attempt fails, which would push a PKGBUILD
          # whose source 404s.
          su builder -c 'cd /home/builder/huebox && ok=0; for i in $(seq 1 5); do makepkg --verifysource && { ok=1; break; }; sleep 30; done; test $ok = 1'

      - name: Commit + push to AUR
        run: |
          cd /home/builder/huebox
          if git diff --quiet; then echo "AUR already at this version - nothing to do"; exit 0; fi
          su builder -c "cd /home/builder/huebox && git -c user.name='huebox-release' -c user.email='huebox-release@users.noreply.github.com' commit -am \"huebox \$(grep '^pkgver=' PKGBUILD | cut -d= -f2)\" && git push origin master"

  homebrew:
    name: Publish to Homebrew tap
    # tags only: a manual run must never touch the real tap. Runs after
    # PyPI and the Release so the index and the artefact are visible
    # before the pointer moves.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [github-release, pypi]
    runs-on: ubuntu-latest
    environment:
      name: homebrew
      url: https://github.com/MikkelKappelPersson/homebrew-huebox
    steps:
      - name: Fetch release shas
        run: |
          set -e
          VER="${GITHUB_REF#refs/tags/v}"
          for asset in x86_64-linux aarch64-linux arm64-macos x86_64-macos; do
            curl -sL -o "huebox-$asset.tar.gz" "https://github.com/MikkelKappelPersson/huebox/releases/download/v$VER/huebox-$VER-$asset.tar.gz"
            var="SUM_$(echo "$asset" | tr 'a-z-' 'A-Z_')"
            echo "$var=$(sha256sum "huebox-$asset.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          done
          echo "tap release $VER assets fetched"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Clone the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -e
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN secret is not set - add the fine-grained PAT under the 'homebrew' environment"
            exit 1
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/MikkelKappelPersson/homebrew-huebox.git" tap

      - name: Bootstrap pour formula on first run
        run: |
          set -e
          if [ -f tap/Formula/huebox.rb ] && grep -q 'releases/download' tap/Formula/huebox.rb && grep -q 'bin.install "huebox"' tap/Formula/huebox.rb; then
            echo "formula already pour-shaped - version bump only"
          else
            echo "one-time bootstrap: writing pour formula"
            mkdir -p tap/Formula
            {
              printf '%s\n' \
                'class Huebox < Formula' \
                '  desc "Terminal theme editor with live preview"' \
                '  homepage "https://github.com/MikkelKappelPersson/huebox"' \
                '  version "PH_VERSION"' \
                '  license "MIT"' \
                '' \
                '  on_macos do' \
                '    on_arm do' \
                '      url "https://github.com/MikkelKappelPersson/huebox/releases/download/v#{version}/huebox-#{version}-arm64-macos.tar.gz"' \
                '      sha256 "PH_ARM64_MACOS"' \
                '    end' \
                '    on_intel do' \
                '      url "https://github.com/MikkelKappelPersson/huebox/releases/download/v#{version}/huebox-#{version}-x86_64-macos.tar.gz"' \
                '      sha256 "PH_X86_64_MACOS"' \
                '    end' \
                '  end' \
                '  on_linux do' \
                '    on_arm do' \
                '      url "https://github.com/MikkelKappelPersson/huebox/releases/download/v#{version}/huebox-#{version}-aarch64-linux.tar.gz"' \
                '      sha256 "PH_AARCH64_LINUX"' \
                '    end' \
                '    on_intel do' \
                '      url "https://github.com/MikkelKappelPersson/huebox/releases/download/v#{version}/huebox-#{version}-x86_64-linux.tar.gz"' \
                '      sha256 "PH_X86_64_LINUX"' \
                '    end' \
                '  end' \
                '' \
                '  def install' \
                '    bin.install "huebox"' \
                '  end' \
                '' \
                '  livecheck do' \
                '    url "https://github.com/MikkelKappelPersson/huebox"' \
                '    strategy :github_latest' \
                '  end' \
                '' \
                '  test do' \
                '    assert_match "huebox #{version}", shell_output("#{bin}/huebox --version")' \
                '  end' \
                'end'
            } > tap/Formula/huebox.rb
          fi

      - name: Bump version + shas, push to the tap
        run: |
          set -e
          cd tap
          sed -i \
            -e "s/^  version \".*\"/  version \"$VER\"/" \
            -e "/arm64-macos.tar.gz/,/sha256/s/sha256 \".*\"/sha256 \"$SUM_ARM64_MACOS\"/" \
            -e "/x86_64-macos.tar.gz/,/sha256/s/sha256 \".*\"/sha256 \"$SUM_X86_64_MACOS\"/" \
            -e "/aarch64-linux.tar.gz/,/sha256/s/sha256 \".*\"/sha256 \"$SUM_AARCH64_LINUX\"/" \
            -e "/x86_64-linux.tar.gz/,/sha256/s/sha256 \".*\"/sha256 \"$SUM_X86_64_LINUX\"/" Formula/huebox.rb
          grep -E '^ +(version|sha256) "' Formula/huebox.rb
          if git diff --quiet; then echo "tap already at this version - nothing to do"; exit 0; fi
          git -c user.name='huebox-release' -c user.email='huebox-release@users.noreply.github.com' commit -am "huebox $VER"
          git push origin main
