name: Publish

# Release first, then PyPI: a version tag builds, tests, drafts the GitHub
# Release with the sdist/wheel attached, and only then uploads to PyPI.
# Tag shape: vX.Y.Z (e.g. v0.2.0) and it must match [project] version.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI instead of PyPI (dry run)"
        type: boolean
        default: true

permissions:
  contents: write # needed to create the GitHub Release
  id-token: write # needed for PyPI Trusted Publishing (OIDC, no token)

jobs:
  build:
    name: Test + build dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag: $TAG  pyproject: $VER"
          test "$TAG" = "$VER" || { echo "::error::tag v$TAG does not match pyproject version $VER"; exit 1; }

      - name: Install package + build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./[test]" build twine

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build sdist + wheel
        run: python -m build

      - name: Check dist
        run: |
          twine check dist/*
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # tag v* pushes already name the release after the tag; keep it a
          # real release, not a draft, so the PyPI job after this has a
          # visible artefact even if the PyPI upload ever fails.
          draft: false
          prerelease: false

  pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    runs-on: ubuntu-latest
    # Manual runs default to TestPyPI so the dry run never pollutes the real
    # index; tag pushes always go to the real PyPI.
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.testpypi) && 'testpypi' || 'pypi' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.testpypi) && 'https://test.pypi.org/p/huebox' || 'https://pypi.org/p/huebox' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || !inputs.testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
