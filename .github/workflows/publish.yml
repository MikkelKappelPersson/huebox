name: Publish

# One tag ships every target: Rust gates, then crates.io plus the GitHub
# Release binary in parallel, then PyPI wheels, then the AUR and Homebrew
# pointers. Tag shape: vX.Y.Z (e.g. v0.5.0) and it must match all 7
# rust/*/Cargo.toml versions.
#
# Source of truth per target:
#   crates.io  — the 7 workspace crates, dep order (Trusted Publishing)
#   GitHub     — prebuilt x86_64-linux binary tarball + sha256
#   PyPI       — binary wheel (prebuilt binary + launcher, ruff-style)
#   AUR        — PKGBUILD builds from the Git tag archive with cargo
#   Homebrew   — formula builds from the Git tag archive with cargo
# The pty replay harness stays a local gate (needs pyte + minutes); CI
# runs the cargo suite, clippy, fmt and the release build.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI instead of PyPI (dry run)"
        type: boolean
        default: true

permissions:
  contents: write # needed to create the GitHub Release
  id-token: write # needed for Trusted Publishing (crates.io + PyPI, OIDC)

jobs:
  gates:
    name: Rust gates + release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Tag matches all Cargo.toml versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          for f in rust/*/Cargo.toml; do
            grep -q "^version = \"$TAG\"$" "$f" || { echo "::error::$f version does not match tag v$TAG"; exit 1; }
          done
          echo "tag v$TAG matches all 7 manifests"

      - name: Run tests
        run: cargo test --workspace --manifest-path rust/Cargo.toml

      - name: Clippy
        run: cargo clippy --workspace --manifest-path rust/Cargo.toml -- -D warnings

      - name: Format
        run: cd rust && cargo fmt --check

      - name: Release build
        run: cargo build --release --manifest-path rust/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: huebox-bin
          path: rust/target/release/huebox
          if-no-files-found: error

  crates:
    name: Publish to crates.io
    # tags only: a manual run must never touch the real index. Dependents
    # resolve path deps against the registry, so this goes in dependency
    # order with a retry loop — the index lags each publish by ~a minute.
    # Re-runs are safe: an already-uploaded crate counts as success.
    if: startsWith(github.ref, 'refs/tags/')
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish in dependency order
        run: |
          set -e
          for p in huebox-core huebox-format huebox-render huebox-lib huebox-editor huebox-app huebox; do
            echo "publishing $p"
            ok=0
            for i in $(seq 1 10); do
              if out=$(cd rust && cargo publish -p "$p" 2>&1); then echo "$out"; ok=1; break; fi
              echo "$out"
              case "$out" in
                *"already uploaded"*|*"already exists"*) echo "$p already on crates.io - continuing"; ok=1; break;;
              esac
              echo "$p attempt $i failed, waiting 60s"; sleep 60
            done
            test "$ok" = 1 || { echo "::error::publishing $p failed"; exit 1; }
          done

  binaries:
    name: Prebuilt Linux binary
    if: startsWith(github.ref, 'refs/tags/')
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: huebox-bin
          path: bin

      - name: Tarball + sha256
        run: |
          set -e
          VER="${GITHUB_REF#refs/tags/v}"
          chmod +x bin/huebox
          T="huebox-$VER-x86_64-linux"
          mkdir "$T" && cp bin/huebox "$T/"
          tar -czf "$T.tar.gz" "$T"
          sha256sum "$T.tar.gz" | tee "$T.tar.gz.sha256"
          mkdir release && mv "$T.tar.gz" "$T.tar.gz.sha256" release/
          ./"$T"/huebox --version

      - uses: actions/upload-artifact@v4
        with:
          name: release-bin
          path: release/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bin
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false

  wheels:
    name: Build wheels
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: huebox-bin
          path: bin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pack wheel
        run: |
          set -e
          chmod +x bin/huebox
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF#refs/tags/v}"; else VER="0.0.0.dev$(date +%s)"; fi
          python .github/pack-wheel.py --binary bin/huebox --version "$VER" --plat linux_x86_64 --out wheels
          ls -l wheels

      - name: Smoke test the wheel
        run: |
          set -e
          python -m venv wheeltest
          ./wheeltest/bin/pip install -q wheels/*.whl
          ./wheeltest/bin/huebox --version

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheels/*
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    # Manual runs default to TestPyPI so the dry run never pollutes the real
    # index; tag pushes always go to the real PyPI.
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.testpypi) && 'testpypi' || 'pypi' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.testpypi) && 'https://test.pypi.org/p/huebox' || 'https://pypi.org/p/huebox' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: wheels/

      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || !inputs.testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/

  aur:
    name: Publish to AUR
    # tags only: a manual run must never touch the real AUR. Runs after
    # PyPI and the Release so the index and the artefact are visible
    # before the pointer moves.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [github-release, pypi]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    environment:
      name: aur
      url: https://aur.archlinux.org/packages/huebox
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh base-devel curl

      - name: Fetch tag tarball + sha256
        run: |
          set -e
          VER="${GITHUB_REF#refs/tags/v}"
          curl -sL -o huebox.tar.gz "https://github.com/MikkelKappelPersson/huebox/archive/refs/tags/v$VER.tar.gz"
          SUM="$(sha256sum huebox.tar.gz | cut -d' ' -f1)"
          echo "aur release $VER sha256 $SUM"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "SUM=$SUM" >> "$GITHUB_ENV"

      - name: Clone the AUR repo as a non-root builder
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not set - add the AUR account's key under the 'aur' environment"
            exit 1
          fi
          useradd -m builder
          install -dm700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /home/builder/.ssh/id_ed25519
          chmod 600 /home/builder/.ssh/id_ed25519
          chown builder:builder /home/builder/.ssh/id_ed25519
          printf 'Host aur.archlinux.org\n  IdentityFile /home/builder/.ssh/id_ed25519\n  IdentitiesOnly yes\n' > /home/builder/.ssh/config
          chown builder:builder /home/builder/.ssh/config
          ssh-keyscan -t ed25519 aur.archlinux.org > /home/builder/.ssh/known_hosts
          chown builder:builder /home/builder/.ssh/known_hosts
          git config --global --add safe.directory /home/builder/huebox
          su builder -c "git clone ssh://aur@aur.archlinux.org/huebox.git /home/builder/huebox"

      - name: Bump pkgver + sums, regenerate .SRCINFO
        run: |
          set -e
          su builder -c "cd /home/builder/huebox && grep -q 'archive/refs/tags' PKGBUILD || { echo '::error::PKGBUILD still points at the PyPI sdist - do the one-time cargo rewrite first'; exit 1; }"
          su builder -c "export VER='$VER' SUM='$SUM'; cd /home/builder/huebox && sed -i -e \"s/^pkgver=.*/pkgver=\$VER/\" -e \"s/^sha256sums=.*/sha256sums=('\$SUM')/\" PKGBUILD && grep -E '^(pkgver|sha256sums)=' PKGBUILD"
          su builder -c "cd /home/builder/huebox && makepkg --printsrcinfo > .SRCINFO"
          # the tag archive must actually be fetchable before the AUR
          # points at it. The flag matters: a bare retry loop exits 0
          # even when every attempt fails, which would push a PKGBUILD
          # whose source 404s.
          su builder -c 'cd /home/builder/huebox && ok=0; for i in $(seq 1 5); do makepkg --verifysource && { ok=1; break; }; sleep 30; done; test $ok = 1'

      - name: Commit + push to AUR
        run: |
          cd /home/builder/huebox
          if git diff --quiet; then echo "AUR already at this version - nothing to do"; exit 0; fi
          su builder -c "cd /home/builder/huebox && git -c user.name='huebox-release' -c user.email='huebox-release@users.noreply.github.com' commit -am \"huebox \$(grep '^pkgver=' PKGBUILD | cut -d= -f2)\" && git push origin master"

  homebrew:
    name: Publish to Homebrew tap
    # tags only: a manual run must never touch the real tap. Runs after
    # PyPI and the Release so the index and the artefact are visible
    # before the pointer moves.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [github-release, pypi]
    runs-on: ubuntu-latest
    environment:
      name: homebrew
      url: https://github.com/MikkelKappelPersson/homebrew-huebox
    steps:
      - name: Fetch tag tarball + sha256
        run: |
          set -e
          VER="${GITHUB_REF#refs/tags/v}"
          curl -sL -o huebox.tar.gz "https://github.com/MikkelKappelPersson/huebox/archive/refs/tags/v$VER.tar.gz"
          SUM="$(sha256sum huebox.tar.gz | cut -d' ' -f1)"
          echo "tap release $VER sha256 $SUM"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "SUM=$SUM" >> "$GITHUB_ENV"

      - name: Bump url + sha256, push to the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -e
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN secret is not set - add the fine-grained PAT under the 'homebrew' environment"
            exit 1
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/MikkelKappelPersson/homebrew-huebox.git" tap
          cd tap
          grep -q 'archive/refs/tags' Formula/huebox.rb || { echo "::error::formula still points at the PyPI sdist - do the one-time cargo rewrite first"; exit 1; }
          sed -i -e "s|archive/refs/tags/v[0-9.]*\.tar\.gz|archive/refs/tags/v$VER.tar.gz|" \
                 -e "0,/^  sha256 \".*\"/s//  sha256 \"$SUM\"/" Formula/huebox.rb
          grep -E '^  (url|sha256) "' Formula/huebox.rb | head -n 2
          if git diff --quiet; then echo "tap already at this version - nothing to do"; exit 0; fi
          git -c user.name='huebox-release' -c user.email='huebox-release@users.noreply.github.com' commit -am "huebox $VER"
          git push origin main
