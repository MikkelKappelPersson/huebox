[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huebox"
version = "0.2.0"
description = "A terminal theme editor with live preview"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["terminal", "theme", "color", "colour", "tui", "ghostty", "kitty", "alacritty"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = ["Pygments>=2.0"]

# The Textual migration (docs/001-spec/textual-migration.md §8) adds Textual as
# an *extra*, not a dependency: `show`, `list`, `detect` and `use` keep exactly
# one dependency, so `huebox edit` is the only command that needs more.
[project.optional-dependencies]
editor = ["textual>=8"]
test = ["pyte>=0.8"]

[project.scripts]
huebox = "huebox.cli:main"

[tool.setuptools]
packages = ["huebox", "huebox.formats"]
