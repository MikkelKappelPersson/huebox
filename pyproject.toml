[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huebox"
version = "0.2.0"
description = "A terminal theme editor with live preview"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Mikkel Kappel Persson", email = "mikkel@kappelpersson.dk" }]
license = { text = "MIT" }
urls = { Homepage = "https://github.com/MikkelKappelPersson/huebox", Repository = "https://github.com/MikkelKappelPersson/huebox", Issues = "https://github.com/MikkelKappelPersson/huebox/issues" }
keywords = ["terminal", "theme", "color", "colour", "tui", "ghostty", "kitty", "alacritty"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
# Two runtime dependencies, and the second one is deliberate (spec §9,
# decision 32): the editor *is* a Textual application now, so an install
# without Textual is an install whose main command fails on open. `show`,
# `list`, `use`, `new`, `import` and `--dump` do not import it, so they never
# pay its import — but they no longer need to be installable without it.
dependencies = ["Pygments>=2.0", "textual>=8"]

[project.optional-dependencies]
test = ["pyte>=0.8"]

[project.scripts]
huebox = "huebox.cli:main"

[tool.setuptools]
packages = ["huebox", "huebox.formats"]
