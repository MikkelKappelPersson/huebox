[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huebox"
version = "2.0.0"
description = "A terminal theme editor with live preview"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["terminal", "theme", "color", "colour", "tui", "ghostty", "kitty", "alacritty"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = ["Pygments>=2.0"]

[project.scripts]
huebox = "huebox.cli:main"

[tool.setuptools]
packages = ["huebox", "huebox.formats"]
